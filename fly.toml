# fly.toml app configuration file generated for mate-laser-frontend on 2026-08-19T22:37:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mate-laser-frontend'
primary_region = 'gru'

[build]
  # Vite hornea estas dos DENTRO del bundle durante "npm run build" — hace
  # falta pasarlas acá como build args. Cargarlas solo como "Environment
  # Variables" en el dashboard de Fly no alcanza: esas llegan al container
  # recién en runtime, después de que el build ya terminó (por eso el primer
  # deploy quedó apuntando a localhost:3000).
  [build.args]
    VITE_API_URL = 'https://api.matelaserstudio.com.ar/api/v1'
    VITE_MP_PUBLIC_KEY = 'TEST-95c78e0e-c298-401d-a0c4-d5f9cdb6217d'
    # Umami Cloud — analítica de visitas cookie-less. No es secreto: el
    # website-id queda visible igual en el <script> del HTML servido.
    VITE_UMAMI_WEBSITE_ID = '29415f8f-63ab-4df2-a553-182cbc44498e'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # A diferencia del backend, acá dejamos 0: es contenido estático detrás de
  # Cloudflare (que ya cachea la mayoría del tráfico real), y un cold start
  # de "serve" arrancando es liviano — no vale pagar una máquina despierta
  # 24/7 solo para esto.
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'
    protocol = 'http'

[[vm]]
  # Servir estáticos con "serve" no necesita 1GB — a diferencia del backend,
  # acá sí conviene bajarla para ahorrar costo.
  memory_mb = 256
  cpu_kind = 'shared'
  cpus = 1
